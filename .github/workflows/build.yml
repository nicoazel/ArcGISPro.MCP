name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./tools/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: arcgis-pro-mcp-development-preview
          path: artifacts/releases/ArcGISProMCP-*-win-x64-development-preview.zip
          if-no-files-found: error
          retention-days: 7
